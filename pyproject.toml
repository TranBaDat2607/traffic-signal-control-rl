[project]
name = "tlcs"
version = "0.1.0"
description = "Reference RL project: DQN and baselines for traffic signal control in SUMO."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nammovuivui", email = "tranbadat26072004@gmail.com" }]
requires-python = ">=3.13,<3.14"

dependencies = [
    "gymnasium>=1.2",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pydantic>=2.12.4",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "torch>=2.9.0",
    "traci>=1.24.0",
    # In-process SUMO for headless runs (src/sumo_api.py). Keep it at the same
    # version as the installed SUMO, or the two backends may disagree.
    "libsumo>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18.2",
    "pdbpp>=0.11.7",
    "pytest>=8.0.0",
    "ruff>=0.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
output-format = "concise"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "G004",   # logging-f-string
    "T201",   # print
    "DTZ005", # call-datetime-now-without-tzinfo
    "S311",   # suspicious-non-cryptographic-random-usage
    "FBT001", # boolean-type-hint-positional-argument
    "D104",   # undocumented-public-package
    "D100",   # undocumented-public-module
    "ISC001", # single-line-implicit-string-concatenation
    "COM812", # missing-trailing-comma
    "CPY001", # missing-copyright-notice (LICENSE covers the repository)
]

[tool.ruff.lint.per-file-ignores]
# The multi-agent grid extension is experimental. Correctness rules apply;
# style rules are relaxed until it is brought up to the core's standard.
"src/grid/*" = ["TC", "E501", "FBT003", "PLR09", "C901", "ERA001", "PERF401", "D107", "D417", "ISC004", "PLC0415", "ARG001", "RUF001", "RUF002"]
"src/grid_train.py" = ["TC", "PLR0915", "RUF001"]
"tests/*" = ["S101", "D", "ANN", "PLR2004", "INP001", "SLF001", "FBT"]
"comparison/*" = ["INP001", "T201", "D103", "E402", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "agent", "constants", "environment", "episode", "evaluation_stats", "logger", "metrics",
    "plots", "policy", "seeding", "settings", "sumo_api", "grid",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["traci.*", "libsumo.*", "sumolib.*"]
ignore_missing_imports = true
